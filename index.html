.regrow .tx > small { font-size: 12px; color: var(--ink2); }
.regrow .mi { display: inline-flex; gap: 2px; vertical-align: -3px; }
.regrow .mi svg { display: inline-block; width: 15px; height: 15px; }
.regrow .hearts { font-size: 15px; }
.regrow .rv { font-size: 11px; color: var(--ink2); white-space: nowrap; }
.regrow .rd { font-weight: 900; min-width: 30px; text-align: right; }
.regrow .rd.up { color: #2e7d4e; }
.regrow .rd.down { color: #c0392b; }
.regrow.unk { opacity: 0.6; }
.reglist.sm .regrow { padding: 4px 8px; }
.reglist.sm .regrow .tx > small { display: none; }
.reglist.sm .regrow .pt, .reglist.sm .regrow .pt svg { width: 30px; height: 30px; }
.fl.love .hrt { color: #e0445a; }
@media (max-width: 520px) { .regrow .rv { display: none; } .regrow .hearts { font-size: 13px; } }
.sbadge {
  position: absolute;
  left: 0; top: 0;
  pointer-events: none;
  will-change: transform;
  display: none;
}

/* Floating tips & money */
.fl {
  position: absolute;
  left: 0; top: 0;
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: 26px;
  color: #f5d469;
  text-shadow: 0 2px 4px #2a160d, 0 0 10px rgba(223, 183, 56, 0.6);
  animation: rise 1.3s ease-out forwards;
  white-space: nowrap;
}
.fl small { font-size: 15px; color: #fff9e0; }
.fl.bad { color: #ffb4a2; text-shadow: 0 2px 4px #4a1608; }
@keyframes rise {
  0% { opacity: 0; margin-top: 0; scale: 0.6; }
  15% { opacity: 1; scale: 1.15; }
  100% { opacity: 0; margin-top: -60px; scale: 1; }
}

/* ============================================================
   BANNERS & TOASTS
   ============================================================ */
#toasts {
  position: fixed;
  left: 50%;
  top: calc(76px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-items: center;
  z-index: 6;
  pointer-events: none;
}
#banner {
  order: -1;
  padding: 9px 20px;
  border-radius: 20px;
  background: linear-gradient(180deg, #381d11 0%, #201008 100%);
  border: 1px solid var(--brass-500);
  color: var(--brass-100);
  font-weight: 800;
  font-size: 14px;
  text-align: center;
  max-width: min(92vw, 560px);
  animation: bin .35s ease both;
  box-shadow: 0 6px 18px rgba(20, 10, 5, 0.45);
}
#banner.ferry {
  background: linear-gradient(180deg, #1b4965 0%, #0d2b3e 100%);
  border-color: #62b6cb;
  color: #e5f6f4;
}
@keyframes bin { from { opacity: 0; transform: translateY(-8px); } }

.toast {
  padding: 8px 18px;
  border-radius: 20px;
  background: linear-gradient(180deg, #3d2416 0%, #25120a 100%);
  border: 1px solid rgba(223, 183, 56, 0.4);
  color: var(--brass-100);
  font-weight: 800;
  font-size: 14px;
  animation: tin 2.4s ease forwards;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(15, 8, 4, 0.4);
}
.toast.bad {
  background: linear-gradient(180deg, #991b1b 0%, #681111 100%);
  border-color: #f87171;
}
.toast.good {
  background: linear-gradient(180deg, #1e5a32 0%, #123d21 100%);
  border-color: #68d391;
}
@keyframes tin {
  0% { opacity: 0; transform: translateY(-8px); }
  8% { opacity: 1; transform: none; }
  85% { opacity: 1; }
  100% { opacity: 0; }
}

/* Flying coins */
.cfly {
  position: fixed;
  left: 0; top: 0;
  width: 22px; height: 22px;
  z-index: 7;
  pointer-events: none;
  transition: transform .7s cubic-bezier(.5, 0, .75, .4), opacity .7s ease-in;
}
.cfly svg { width: 22px; height: 22px; }
.chip.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }

/* ============================================================
   MODAL DIALOGS & SCREENS (#screen, .card)
   ============================================================ */
#screen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 8;
  background: rgba(18, 9, 5, 0.68);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 14px;
  overflow: auto;
}
body.low #screen { backdrop-filter: none; -webkit-backdrop-filter: none; }

.card {
  position: relative;
  width: min(620px, 100%);
  max-height: 94vh;
  overflow: auto;
  padding: 26px 28px;
  text-align: center;
  background: linear-gradient(180deg, #fffdf9 0%, #faf4e8 100%);
  border: 2px solid var(--brass-500);
  box-shadow: 0 24px 60px rgba(15, 8, 4, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  border-radius: 22px;
  animation: cin .35s cubic-bezier(.2, 1.2, .4, 1);
}
@keyframes cin { from { opacity: 0; transform: translateY(14px) scale(.96); } }

.card h1 {
  margin: 6px 0 4px;
  font-family: var(--font-serif);
  font-size: 46px;
  line-height: 1.05;
  color: #8b4a11;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
}
.card h2 {
  margin: 0 0 8px;
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 800;
  color: #2a160d;
}
.card p {
  margin: 7px 0;
  font-weight: 600;
  color: #54311e;
  line-height: 1.45;
}
.card .big { width: 76px; height: 76px; margin: 0 auto; }
.card .biglogo {
  display: block;
  width: 128px; height: 128px;
  margin: -4px auto 0;
  filter: drop-shadow(0 4px 10px rgba(90, 40, 10, 0.3));
}

.how {
  list-style: none;
  padding: 0;
  margin: 14px 0;
  text-align: left;
  display: grid;
  gap: 8px;
}
.how li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-weight: 600;
  font-size: 14px;
  line-height: 1.35;
  background: #fff;
  border: 1px solid #e8d9c2;
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 2px 6px rgba(42, 22, 13, 0.08);
}
.how li b {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(180deg, #3d2416 0%, #201008 100%);
  border: 1px solid var(--brass-500);
  color: var(--brass-300);
  font-family: var(--font-serif);
  font-weight: 800;
  display: grid;
  place-items: center;
  font-size: 12px;
}

/* Primary and Alternative Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 28px;
  border-radius: 14px;
  background: linear-gradient(180deg, #e8863d 0%, #c2410c 100%);
  border: 1px solid #ffd469;
  color: #fff;
  font-family: var(--font-sans);
  font-weight: 800;
  font-size: 17px;
  box-shadow: 0 4px 0 #7c2d12, 0 8px 18px rgba(124, 45, 18, 0.4);
  margin: 6px 4px;
  cursor: pointer;
  transition: transform .08s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #7c2d12;
}
.btn.alt {
  background: linear-gradient(180deg, #faf4e8 0%, #ede0cb 100%);
  border: 1px solid #c9a227;
  color: #2a160d;
  box-shadow: 0 3px 0 #8c644d, 0 6px 12px rgba(42, 22, 13, 0.15);
}
.btn.alt:hover { filter: brightness(1.04); }
.btn.alt:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #8c644d;
}
.btn.sm { padding: 9px 18px; font-size: 14px; }
.btn[disabled] {
  opacity: 0.45;
  pointer-events: none;
  filter: grayscale(0.7);
}

.rowk {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 10px;
  background: #fff;
  border: 1px solid #e8d9c2;
  margin: 6px 0;
}
.rowk span:last-child { font-weight: 900; }

.stars { display: flex; justify-content: center; gap: 7px; margin: 10px 0; }
.stars svg { width: 54px; height: 54px; }
.stars svg.pop { animation: starpop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }

.chipnew {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #d97e27 0%, #94460f 100%);
  border: 1px solid #ffd469;
  color: #fff;
  border-radius: 30px;
  padding: 6px 16px 6px 8px;
  font-weight: 800;
  margin: 8px 0;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
}
.chipnew svg {
  width: 30px; height: 30px;
  background: #fff;
  border-radius: 50%;
  padding: 3px;
}

.menurow { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
.menurow span {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid #e8d9c2;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 6px rgba(42, 22, 13, 0.08);
}
.menurow span svg { width: 30px; height: 30px; }

/* Shop Layout */
.shop {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
  margin: 12px 0;
  text-align: left;
}
.up {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px;
  border-radius: 14px;
  background: #fff;
  border: 1.5px solid #e8d9c2;
  box-shadow: 0 2px 8px rgba(42, 22, 13, 0.08);
}
.up.can {
  border-color: var(--brass-500);
  box-shadow: 0 4px 14px rgba(223, 183, 56, 0.25);
}
.up .ic {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: linear-gradient(180deg, #faf4e8 0%, #f0e2cc 100%);
  border: 1px solid var(--brass-400);
  display: grid;
  place-items: center;
  flex: none;
}
.up .ic svg { width: 32px; height: 32px; }
.up .tx { flex: 1; min-width: 0; }
.up .tx b { display: block; font-size: 15px; font-weight: 800; color: #2a160d; }
.up .tx small { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); line-height: 1.25; }

.pips { display: flex; gap: 3px; margin-top: 5px; }
.pips i {
  width: 14px; height: 6px;
  border-radius: 3px;
  background: rgba(42, 22, 13, 0.15);
}
.pips i.on { background: #d97e27; }

.buy {
  min-width: 74px;
  padding: 8px 10px;
  border-radius: 11px;
  background: linear-gradient(180deg, #e8863d 0%, #c2410c 100%);
  border: 1px solid #ffd469;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: 0 3px 0 #7c2d12;
  cursor: pointer;
}
.buy svg { width: 16px; height: 16px; }
.buy[disabled] {
  background: #c7b9ab;
  border-color: #baa898;
  box-shadow: 0 3px 0 #9e8e80;
  pointer-events: none;
}
.buy.max {
  background: linear-gradient(180deg, #38a169 0%, #22543d 100%);
  border-color: #9ae6b4;
  box-shadow: 0 3px 0 #1c4532;
}

.wallet {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(180deg, #3d2416 0%, #201008 100%);
  border: 1.5px solid var(--brass-500);
  color: var(--brass-300);
  padding: 6px 18px;
  border-radius: 30px;
  box-shadow: inset 0 1px 0 rgba(255, 249, 224, 0.3), 0 4px 12px rgba(0, 0, 0, 0.3);
}
.wallet svg { width: 26px; height: 26px; }

.card .lang { position: absolute; right: 14px; top: 12px; }
.card .gear { position: absolute; left: 14px; top: 12px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 8px 0; }
.col .btn { min-width: min(280px, 100%); margin: 4px; }

.foot { margin: 14px 0 0; font-size: 12px; font-weight: 600; color: var(--ink2); }
.foot a { color: #8b4a11; text-decoration: none; font-weight: 800; }
.foot a:hover { text-decoration: underline; }

/* In-game overlays */
.coach {
  position: absolute;
  left: 0; top: 0;
  display: none;
  pointer-events: none;
  will-change: transform;
  z-index: 2;
}
.coach .cm { position: relative; display: flex; flex-direction: column; align-items: center; }
.coach .tx {
  padding: 7px 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, #3d2416 0%, #201008 100%);
  border: 1px solid var(--brass-500);
  color: var(--brass-100);
  font-weight: 800;
  font-size: 13px;
  text-align: center;
  max-width: 220px;
  line-height: 1.25;
  box-shadow: 0 4px 14px rgba(15, 8, 4, 0.5);
}
.coach .ar {
  width: 0; height: 0;
  border: 9px solid transparent;
  border-top-color: #201008;
  margin-top: -1px;
}
.coach .pl {
  position: absolute;
  left: 50%; bottom: -19px;
  width: 38px; height: 38px;
  margin-left: -19px;
  border-radius: 50%;
  border: 3px solid #dfb738;
  animation: cping 1.1s ease-out infinite;
}
@keyframes cping { 0% { transform: scale(.5); opacity: .95; } 100% { transform: scale(1.7); opacity: 0; } }
.st.coachst { animation: pulseBrass 1.2s ease-in-out infinite; }

.cring {
  position: absolute;
  left: 0; top: 0;
  width: 46px; height: 46px;
  display: none;
  pointer-events: none;
  will-change: transform;
}
.cring svg { width: 46px; height: 46px; transform: rotate(-90deg); }

.gmark {
  position: absolute;
  left: 0; top: 0;
  display: none;
  width: 50px; height: 50px;
  border-radius: 50%;
  background: #fffdf9;
  border: 2px solid var(--brass-500);
  place-items: center;
  pointer-events: auto;
  cursor: pointer;
  will-change: transform;
  animation: gping .7s ease-out infinite;
}
.gmark svg { width: 34px; height: 34px; }
@keyframes gping {
  from { box-shadow: 0 0 0 0 rgba(194, 65, 12, .7), 0 4px 12px rgba(80, 40, 10, .35); }
  to { box-shadow: 0 0 0 12px rgba(194, 65, 12, 0), 0 4px 12px rgba(80, 40, 10, .35); }
}

.slot .fb {
  position: absolute;
  left: 4px; right: 4px; bottom: 3px;
  height: 4px;
  border-radius: 2px;
  background: rgba(0, 0, 0, 0.4);
  overflow: hidden;
}
.slot .fb i { display: block; height: 100%; background: #2e7d4e; }
.slot .fb.mid i { background: #df9e18; }
.slot .fb.old i { background: #8c827a; }

.sfb {
  display: block;
  position: absolute;
  left: 9px; right: 9px; bottom: 2px;
  height: 3px;
  border-radius: 2px;
  background: rgba(0, 0, 0, 0.3);
  overflow: hidden;
}
.sfb i { display: block; height: 100%; }

.fact {
  margin: 12px 0 4px;
  padding: 10px 14px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid #e8d9c2;
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  color: #54311e;
  box-shadow: 0 2px 6px rgba(42, 22, 13, 0.08);
}
.fact b {
  display: block;
  font-size: 11px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #8b4a11;
  margin-bottom: 3px;
}

.rank {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 8px 0 2px;
  font-weight: 800;
  flex-wrap: wrap;
}
.rank .rk {
  padding: 3px 14px;
  border-radius: 20px;
  background: linear-gradient(180deg, #3d2416 0%, #201008 100%);
  border: 1px solid var(--brass-500);
  color: var(--brass-300);
  font-weight: 900;
}
.rank small { color: var(--ink2); font-weight: 600; font-size: 12px; }

.rbar {
  height: 6px;
  border-radius: 4px;
  background: rgba(42, 22, 13, 0.16);
  overflow: hidden;
  margin: 6px auto 6px;
  max-width: 260px;
}
.rbar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #f5d469, #e8863d);
}

.cushion { position: relative; display: inline-block; isolation: isolate; flex: none; }
.cushion::after {
  content: "";
  position: absolute;
  left: 6%; right: 6%; bottom: 3px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(#ee8a43, #c2410c);
  z-index: -1;
}
.mascot {
  display: block;
  width: 76px; height: 76px;
  object-fit: contain;
  filter: drop-shadow(0 3px 6px rgba(90, 40, 10, 0.25));
}
.sumrow { display: flex; align-items: center; justify-content: center; gap: 8px; }
.shophead { display: flex; align-items: flex-end; justify-content: center; gap: 10px; flex-wrap: wrap; }
.shophead .sem {
  width: 50px; height: 50px;
  border-radius: 14px;
  background: #fff;
  border: 1.5px solid var(--brass-400);
  display: grid;
  place-items: center;
  align-self: center;
}
.shophead .sem svg { width: 36px; height: 36px; }

.rec {
  display: inline-block;
  margin: 6px 0;
  padding: 4px 16px;
  border-radius: 20px;
  background: linear-gradient(180deg, #f5d469 0%, #dfb738 100%);
  border: 1px solid #785d0d;
  color: #2a160d;
  font-weight: 900;
  animation: starpop .6s cubic-bezier(.2, 1.6, .4, 1) both .4s;
}

/* Settings Dialog */
.set { display: grid; gap: 8px; margin: 14px 0; text-align: left; }
.set label, .set .row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid #e8d9c2;
  min-height: 48px;
}
.set label span:first-child, .set .row span:first-child { flex: none; width: 118px; }
.set input[type=range] {
  flex: 1;
  accent-color: #c2410c;
  height: 28px;
  min-width: 0;
}
.set output { width: 38px; text-align: right; font-weight: 900; }
.seg { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.seg button {
  flex: 1;
  min-height: 38px;
  border-radius: 10px;
  background: #faf4e8;
  border: 1px solid #d5c0a3;
  font-weight: 800;
  padding: 4px 10px;
  color: #2a160d;
}
.seg button.on {
  background: linear-gradient(180deg, #d97e27 0%, #94460f 100%);
  border-color: #ffd469;
  color: #fff;
}
.set small {
  display: block;
  font-size: 12px;
  color: var(--ink2);
  font-weight: 600;
  margin: -2px 2px 0;
}

:focus-visible {
  outline: 3px solid var(--brass-400);
  outline-offset: 2px;
}

.conf { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
.conf i { position: absolute; top: -20px; width: 10px; height: 16px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

#dbg {
  position: fixed;
  left: 8px; top: 84px;
  z-index: 20;
  font: 12px/1.35 ui-monospace, Consolas, monospace;
  color: #102;
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid #ccc;
  padding: 5px 8px;
  border-radius: 8px;
  display: none;
  max-width: 60vw;
  white-space: pre-wrap;
  pointer-events: none;
}
#dbg .err { color: #c00; font-weight: 700; }
#fatal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  font-weight: 800;
  background: #fbe3c3;
  z-index: 50;
}

/* ============================================================
   RESPONSIVE & MOBILE ADAPTATION
   ============================================================ */
@media (max-width: 768px) {
  #top {
    gap: 8px;
    padding: 6px 10px;
    border-radius: 12px;
  }
  #top .logo { font-size: 17px; }
  #top .logo svg { width: 24px; height: 24px; }
  .bar { width: 70px; }
  #dock { gap: 8px; }
  #tray, #stations { padding: 6px 8px; border-radius: 14px; }
  .slot { width: 40px; height: 40px; }
  .st { width: 68px; padding: 6px 3px; }
  .st svg { width: 26px; height: 26px; }
  .st b { font-size: 11px; }
  .card { padding: 20px 16px; }
  .card h1 { font-size: 38px; }
  .card h2 { font-size: 24px; }
}

@media (pointer: coarse) {
  /* Touch target craft floor: >= 44x44px */
  .ibtn { min-width: 44px; height: 44px; }
  .slot { min-width: 44px; min-height: 44px; }
  .st { min-height: 72px; }
  .btn { min-height: 48px; }
  .buy { min-height: 44px; }
}

@media (max-width: 440px) {
  #top { gap: 5px; padding: 5px 8px; }

function drawSign() {

  // Dark teal-walnut enamel base
  g.fillStyle = '#1b2829'; g.fillRect(0, 0, 1024, 96);

  g.strokeStyle = '#c9a227'; g.lineWidth = 3; g.strokeRect(6, 6, 1012, 84);
  g.strokeStyle = 'rgba(245, 212, 105, 0.45)'; g.lineWidth = 1; g.strokeRect(12, 12, 1000, 72);

  g.fillStyle = 'rgba(0, 0, 0, 0.7)'; g.fillText('ÇAY OCAĞI', 514, 54);

}

  catch (e) { console.warn('[cay] GLTFLoader not available, keeping the procedural look'); return icons; }

  if (M.sink) place('sink', geoOf('sink', 1.55 / M.sink.size.z), CNT_X + .3, TOP, STATION_Z.sink);
  if (M.window) {
    // back flush with the façade (x = -8.1), under the roof slab
    const g = geoOf('window', 1.05 / M.window.size.y), im = new THREE.InstancedMesh(g, M.window.mat, 5), wx = -8.1 + g.boundingBox.max.x - .04;
    for (let i = 0; i < 5; i++) im.setMatrixAt(i, mat(wx, 5.2, -7 + i * 3.25));
    im.castShadow = sh; world.add(im);
  }
  if (M.table) {
    // white cloth tinted per table by the existing instance colours; top at the old height (.975), pivot moved to y .93
    const g = geoOf('table', 1.8 / M.table.size.x, .98 / M.table.size.y, 1.8 / M.table.size.z).translate(0, -.93, 0);
    TB.tops.geometry.dispose(); TB.tops.material.dispose(); TB.tops.geometry = g; TB.tops.material = M.table.mat; TB.legs.visible = false;
  }
  if (M.ferry) { const f = ferryObj.children[0]; f.geometry.dispose(); f.material.dispose(); f.geometry = geoOf('ferry', 8 / M.ferry.size.x).translate(0, -.55, 0); f.material = M.ferry.mat; }
  if (M.cat) { const c = catGrp.children[0]; c.geometry.dispose(); c.material.dispose(); c.geometry = geoOf('cat', .85 / M.cat.size.x); c.material = M.cat.mat; }
  if (groundTex) {
    const W = 31.5, D = 23, g = new THREE.PlaneGeometry(W, D).rotateX(-Math.PI / 2);
    groundTex.repeat.set(W / 5, D / 5); // one texture tile per 5 m
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: groundTex }));
    m.position.set(-14 + W / 2, .015, -9 + D / 2); m.receiveShadow = sh; world.add(m);
  }
}

/* ============================================================
   main loop
   ============================================================ */
window.addEventListener('error', e => { G.errors.push((e.message || 'error') + (e.lineno ? ' @' + e.lineno : '')); if (G.errors.length > 5) G.errors.shift(); });
window.addEventListener('unhandledrejection', e => { G.errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); if (G.errors.length > 5) G.errors.shift(); });
if (FLAG.debug) dbgEl.style.display = 'block';

let lastT = performance.now(), acc = 0, fpsT = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  fpsT += dtReal; fpsN++; if (fpsT >= .5) { G.fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0; }
  if (!G.paused && !document.hidden) {
    acc += dtReal * G.speed; let n = 0;
    while (acc >= STEP && n < 14) { simStep(STEP); acc -= STEP; n++; }
    if (n >= 14) acc = 0;
  }
  if (G.waiter) syncVisuals(dtReal);
  if (!G.paused) particlesUpdate(dtReal * Math.min(G.speed, 2));
  uiFrame(dtReal);
  hoverRing.material.opacity = .6 + Math.sin(now / 160) * .25;
  for (let i = 0; i < BULBS.n; i++) BULBS.ap[i * 2] = .34 + .12 * Math.sin(now / 420 + i * 1.9);
  BULBS.geo.attributes.ap.needsUpdate = true;
  lampA.intensity = 17 + Math.sin(now / 230) * 1.4 + Math.sin(now / 71) * .8; lampB.intensity = 14 + Math.sin(now / 310 + 2) * 1.2 + Math.sin(now / 97) * .6;
  renderer.render(scene, cam);
  G.drawCalls = renderer.info.render.calls; if (G.drawCalls > G.maxDrawCalls) G.maxDrawCalls = G.drawCalls;
}

/* boot */
document.documentElement.lang = G.lang;
if (window.Arena) Arena.lang(G.lang);
layoutCamera();
scene.updateMatrixWorld(true);
resetWorldForDay();
uiStatic();
uiScreen(true);
window.cayBench = function (n, base) {
  const res = []; G.botHold = false; const keep = FLAG.stop; FLAG.stop = '';
  for (let i = 0; i < n; i++) {
    // every bench game starts from its own seed with the cat asleep at home (as a daily attempt does), so the bench
    // does not depend on the page load (the regulars' affection still carries from game to game, as in real play)
    _seed = (base || 1) * 1000 + i; Object.assign(cat, { x: CATHOME.x, z: CATHOME.z, y: .3, face: Math.PI / 2, state: 'sleep', t: 14 + rnd() * 10, path: [], moving: false, pet: 0 });
    G.log = []; G.state = 'title'; A.start(); G.simming = true; let steps = 0;
    while (G.state !== 'victory' && G.state !== 'gameover' && steps < 60 * 60 * 80) { simStep(STEP); steps++; }
    res.push({ reached: G.day, state: G.state, log: G.log.slice() });
  }
  G.simming = false; FLAG.stop = keep;
  const days = {}; res.forEach(r => r.log.forEach(l => { const o = days[l.day] || (days[l.day] = { n: 0, ratio: 0, angry: 0, happy: 0, stars: 0, fail: 0, sp: 0, bl: 0 }); o.n++; o.sp += l.spawned; o.bl += l.blocked; o.ratio += l.coins / l.target; o.angry += l.angry; o.happy += l.happy; o.stars += l.stars; if (!l.passed) o.fail++; }));
  let s = `bench n=${n} wins=${res.filter(r => r.state === 'victory').length}
`;
  Object.keys(days).forEach(k => { const o = days[k]; s += `d${k}: ratio ${(o.ratio / o.n).toFixed(2)} happy ${(o.happy / o.n).toFixed(1)} angry ${(o.angry / o.n).toFixed(1)} stars ${(o.stars / o.n).toFixed(1)} fail ${o.fail}/${o.n} spawned ${(o.sp / o.n).toFixed(1)} walkby ${(o.bl / o.n).toFixed(1)}
`; });
  G.benchOut = s; return s;
};
function clickTest() {
  const out = []; A.start(); A.begin(); G.botHold = true; G.paused = false;
  const fire = (type, x, y) => canvas.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, pointerId: 7, pointerType: 'mouse', button: 0, bubbles: true }));
  const clickWorld = (x, y, z) => { toScreen(x, y, z, _sp); fire('pointerdown', _sp.x, _sp.y); fire('pointerup', _sp.x, _sp.y); };
  toScreen(CNT_X, 1.8, STATION_Z.tea, _sp); const pk = pickAt(_sp.x, _sp.y); out.push('pick@tea=' + (pk ? pk.kind + ':' + pk.id : 'none') + ' at ' + Math.round(_sp.x) + ',' + Math.round(_sp.y) + ' state=' + G.state);
  clickWorld(CNT_X, 1.8, STATION_Z.tea); out.push('queue after tea click=' + G.waiter.q.length);
  window.caySim(9); out.push('kettle=' + G.stations.kettles[0].st + ' t=' + G.stations.kettles[0].t.toFixed(1));
  window.caySim(2); out.push('kettle=' + G.stations.kettles[0].st);
  clickWorld(CNT_X, 1.8, STATION_Z.tea); window.caySim(5); out.push('tray=' + G.waiter.tray.join('+'));
  clickWorld(-1.0, 1.0, -0.5); out.push('queue after table click=' + G.waiter.q.length);
  clickWorld(CNT_X, 1.8, STATION_Z.ayran); out.push('ayran(locked) queue=' + G.waiter.q.length);
  window.caySim(4); out.push('waiter state=' + G.waiter.state + ' tray=' + G.waiter.tray.join('+'));
  G.testOut = out.join(' | ');
}
/* ?selftest: checks the v2 mechanics by simulation (no rendering) and writes PASS/FAIL lines to window.cay.selfTest */
function selfTest() {
  const out = [], ok = (name, cond, info = '') => out.push((cond ? 'PASS ' : 'FAIL ') + name + (info ? ' ' + info : ''));
  const keepSpeed = G.speed; G.botHold = true; _seed = 4242;
  // 1. one click from the title into a running day 1
  G.state = 'title'; A.start(); ok('start goes straight to play', G.state === 'play' && G.day === 1, G.state);
  // 2. toasts do not stack
  toast('same'); toast('same'); ok('toast dedupe', toastsEl.querySelectorAll('.toast').length === 1);
  toastsEl.querySelectorAll('.toast').forEach(e => e.remove());
  // 3. tea freshness: fresh for TEA.fresh s on the tray, stale after TEA.fresh + TEA.fade
  G.simming = true; G.stations.kettles[0] = { st: 'ready', t: 0, n: TEA_N }; doStation('tea');
  const f0 = G.trayFresh()[0]; for (let i = 0; i < 60 * 33; i++) waiterUpdate(STEP); const f1 = G.trayFresh()[0]; for (let i = 0; i < 60 * 10; i++) waiterUpdate(STEP); const f2 = G.trayFresh()[0];
  ok('tea fresh then fading then stale', f0 === 1 && f1 > 0 && f1 < 1 && f2 === 0, `${f0} ${f1} ${f2}`);
  const tip = ord => { const b = G.dayTips; payParty({ order: [1, 2, 3].map(() => ({ item: 'tea', done: true, ...ord })), finalFrac: 1, cc: CUST.normal, persons: [1], tb: 0 }); return G.dayTips - b; };
  const tFresh = tip({}), tStale = tip({ stale: true });
  ok('stale tea pays less tip', tStale < tFresh, `${tFresh} vs ${tStale}`);
  // cold pot is tipped out and re-brewed
  G.stations.kettles[0] = { st: 'ready', t: TEA.fresh + TEA.fade + 1, n: 3 }; doStation('tea');
  ok('cold pot is re-brewed', G.stations.kettles[0].st === 'brewing');
  // 4. perfect coffee
  G.waiter.tray.length = 0; G.waiter.meta.length = 0; G.stations.pots[0] = { st: 'ready', t: .3 }; doStation('coffee');
  const b0 = G.dayTips; payParty({ order: [{ item: 'coffee', done: true, perfect: G.waiter.meta[0].perfect }], finalFrac: 1, cc: CUST.normal, persons: [1], tb: 0 });
  ok('perfect coffee adds tip', G.perfects === 1 && G.dayTips - b0 >= PERFECT.tip, `${G.perfects} +${G.dayTips - b0}`);
  // 5. gull thief: steals an unshooed simit, a click shoos it
  G.day = 3; beginDay(false); G.simming = true;
  const tb = G.tables[0], party = { state: 'eat', tb: 0, order: [{ item: 'simit', done: true }], cc: CUST.normal, persons: [1], finalFrac: 1 };
  tb.party = party; tb.slots = [{ kind: 'plate', item: 'simit', dirty: false }];
  Object.assign(thief, { state: 'dive', tb: 0, t: .01, x0: 0, y0: 1.5, z0: -9, x: 0, y: 1.5, z: -9 }); G.clock = 60; gullUpdate(.05); gullUpdate(.05);
  ok('gull steals the simit', party.order[0].stolen === true && tb.slots.length === 0 && G.gull.stolen === 1);
  Object.assign(thief, { state: 'perch', t: 3 }); const shooed = clickGull();
  ok('click shoos the gull', shooed && thief.state === 'flee' && G.gull.shooed === 1);
  tb.party = null;
  // 6. ferry rush on day 3: horn warning, then 2-3 parties inside 10 s, same customer count
  G.up.table = 3; G.day = 3; beginDay(false); G.simming = true; const wasWarn = []; let rushAt = -1, partiesAt = 0;
  for (let i = 0; i < 60 * 60; i++) {
    simStep(STEP); if (G.rushSoon) wasWarn.push(G.clock);
    if (G.clock > 29.2 && G.clock < 29.3) for (const p of G.parties.splice(0)) { p.persons.forEach(freePerson); G.tables[p.tb].party = null; } // empty room just before the ferry arrives (no bot here)
    if (G.rushes.length && rushAt < 0) rushAt = G.clock;
    if (rushAt > 0 && G.clock > rushAt + 11 && !partiesAt) partiesAt = G.parties.length + G.walkby;
  }
  const r0 = G.rushes[G.rushes.length - 1];
  ok('rush warns, then fills tables', !!r0 && r0.n >= 2 && wasWarn.length > 0 && partiesAt >= 2, `rushes ${G.rushes.length} n=${r0 && r0.n} warnFrom ${wasWarn[0] && wasWarn[0].toFixed(1)} at ${rushAt.toFixed(1)} parties ${partiesAt}`);
  // 7. regular: tavla refills (bot serves them), at least 2 asked; the bot is switched on for this check only, so plain ?selftest needs no ?auto
  const keepAuto = FLAG.auto; FLAG.auto = true;
  G.day = 7; beginDay(false); G.simming = true; G.botHold = false; G.stations.kettles[0] = { st: 'ready', t: 0, n: TEA_N };
  G.up.tray = 2; G.waiter.q.length = 0; window.cay.spawnRegular();
  for (let i = 0; i < 60 * 150 && G.state === 'play'; i++) { simStep(STEP); if (G.refill.asked >= 2) break; }
  ok('regular asks for >= 2 refills', G.refill.asked >= 2, `asked ${G.refill.asked} done ${G.refill.done} missed ${G.refill.missed}`);
  G.botHold = true; FLAG.auto = keepAuto;
  // 8. rank thresholds and the facts table
  ok('ranks', rankOf(0) === 0 && rankOf(RANKS[1].from) === 1 && rankOf(RANKS[2].from) === 2 && FACTS.length === 6);
  G.simming = false; G.speed = keepSpeed; G.state = 'title'; uiScreen(true);
  G.selfTest = out; G.testOut = out.join('\n');
}
if (Q.has('selftest')) { try { selfTest(); } catch (e) { G.errors.push('selftest: ' + e.message + ' ' + (e.stack || '').split('\n')[1]); } }
if (Q.has('audiotest')) {
  sfxInit(); const fns = { sfxBell, sfxClink, sfxCash, sfxPip, sfxPing, sfxTick, sfxPour, sfxWash, sfxHiss, sfxWhistle, sfxGrumble, sfxFanfare, sfxLose, sfxGull, sfxHorn, sfxMeow, sfxPerfect, sfxSquawk }; let okc = 0;
  if (!Aud.ctx) G.testOut = 'audio: no Web Audio';
  else Aud.ctx.resume().then(() => { for (const k in fns) { try { fns[k](); okc++; } catch (e) { G.errors.push(k + ': ' + e.message); } } G.testOut = 'audio state=' + Aud.ctx.state + ' called=' + okc + '/' + Object.keys(fns).length; }).catch(e => G.errors.push('audio ' + e.message));
}
if (Q.has('clicktest')) { try { clickTest(); } catch (e) { G.errors.push('clicktest: ' + e.message); } }
if (FLAG.bench) { try { window.cayBench(FLAG.bench, 1); } catch (e) { G.errors.push('bench: ' + e.message); } }
if (FLAG.sim > 0) { try { window.caySim(FLAG.sim); } catch (e) { G.errors.push('sim: ' + e.message + ' ' + (e.stack || '').split('\n')[1]); } }
requestAnimationFrame(frame);
// the title screen waits for the models (Play disabled); after 15 s the game goes on with whatever has loaded.
// ?auto starts at once as before and the models swap in when they arrive, so bot runs stay comparable.
// G.assetsReady / G.assets: test hooks (which generated assets replaced their procedural part)
G.assets = [];
if (!NOASSETS) Promise.race([loadAssets(), new Promise(r => setTimeout(r, 15000))]).then(() => {
  try { applyAssets(); } catch (e) { G.errors.push('assets: ' + e.message); }
  assetState.done = true; G.assetsReady = true;
  uiStatic(); uiScreen(true); // the icon PNGs are in now
});
