</script>
<style>
:root{--amber:#C2410C;--amber2:#ea6a24;--ink:#3a2314;--ink2:#7a5a44;--glass:rgba(255,248,235,.64);--glassb:rgba(255,255,255,.6);--r:16px;--ok:#3f8f4a;--bad:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;
background:radial-gradient(circle at 78% 14%,#fff3c9 0,#ffd58f 9%,rgba(255,190,110,0) 30%),linear-gradient(#f39a5d,#fbc98c 40%,#ffe6c4)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border:1px solid var(--glassb);box-shadow:0 6px 22px rgba(90,40,10,.18),inset 0 1px 0 rgba(255,255,255,.65);border-radius:var(--r)}
body.low .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,246,230,.86)}
svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#wl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
/* top bar */
#top{position:fixed;left:8px;right:8px;top:8px;display:flex;align-items:center;gap:10px;padding:6px 10px;z-index:5;flex-wrap:wrap}
#top .logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;letter-spacing:.2px;color:var(--amber)}
#top .logo svg{width:26px;height:26px}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;white-space:nowrap}
.chip svg{width:22px;height:22px;flex:none}
.chip small{font-weight:700;color:var(--ink2);font-size:12px}
.bar{position:relative;width:96px;height:8px;border-radius:6px;background:rgba(80,40,10,.16);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#e8863d,var(--amber));border-radius:6px}
.bar.clock i{background:linear-gradient(90deg,#f3c14f,#e8863d)}
.sp{flex:1}
.ibtn{min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:13px;padding:0 6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.ibtn:hover{background:#fff}.ibtn:active{transform:scale(.94)}
.ibtn svg{width:20px;height:20px}
.ibtn.on{background:var(--amber);color:#fff}
.btns{display:flex;gap:6px}
/* dock */
#dock{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap;z-index:5;pointer-events:none}
#dock>*{pointer-events:auto}
#tray{display:flex;align-items:center;gap:8px;padding:8px 10px}
#tray .lbl{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2)}
.slots{display:flex;gap:5px}
.slot{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.55);border:2px dashed rgba(120,70,30,.28);display:grid;place-items:center;position:relative}
.slot svg{width:28px;height:28px}
.slot.full{border:2px solid rgba(255,255,255,.9);background:#fff;cursor:pointer}
.slot.lock{opacity:.28;border-style:dotted}
.slot.full:hover::after{content:"×";position:absolute;right:-5px;top:-7px;width:17px;height:17px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;line-height:17px;text-align:center;font-weight:900}
#queue{display:flex;gap:4px;align-items:center;min-width:0}
#queue .q{width:22px;height:22px;border-radius:7px;background:var(--amber);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center}
#queue .qx{font-size:11px;font-weight:900;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:2px 4px}
#stations{display:flex;gap:6px;padding:6px}
.st{position:relative;width:78px;padding:6px 4px 7px;border-radius:13px;background:rgba(255,255,255,.55);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,background .15s}
.st:hover,.st.hov{background:#fff;border-color:var(--amber)}
.st:active{transform:scale(.95)}
.st svg{width:30px;height:30px}
.st b{font-size:12px;font-weight:900;line-height:1}
.st .key{position:absolute;left:5px;top:4px;font-size:10px;font-weight:900;color:#fff;background:var(--ink2);border-radius:5px;padding:1px 5px}
.st .units{display:flex;gap:3px;width:100%;margin-top:2px}
.st .u{flex:1;height:8px;border-radius:5px;background:rgba(80,40,10,.17);position:relative;overflow:hidden}
.st .u i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:#e8863d}
.st .u.ready i{background:var(--ok);width:100%!important}
.st .u.warn i{background:#d4a017}
.st .u.bad i{background:var(--bad);width:100%!important}
.st .u.blink{animation:blink .35s steps(2) infinite}
.st .cnt{position:absolute;right:3px;top:2px;min-width:20px;height:20px;border-radius:10px;background:var(--ok);color:#fff;font-size:12px;font-weight:900;display:none;place-items:center;padding:0 4px}
.st.lock{opacity:.35;pointer-events:none;filter:grayscale(.8)}
.st.ready{animation:pulse 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(194,65,12,.35)}}
/* bubbles */
.bub{position:absolute;left:0;top:0;display:none;align-items:center;gap:5px;padding:4px 8px 4px 4px;border-radius:30px;background:rgba(255,252,244,.94);box-shadow:0 4px 12px rgba(80,40,10,.28);pointer-events:auto;cursor:pointer;will-change:transform;white-space:nowrap}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:rgba(255,252,244,.94);transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.bub .ring{position:relative;width:38px;height:38px;flex:none}
.bub .ring svg.r{position:absolute;inset:0;width:38px;height:38px;transform:rotate(-90deg)}
.bub .ring .av{position:absolute;inset:7px;display:grid;place-items:center}
.bub .ring .av svg{width:24px;height:24px}
.bub .it{display:flex;gap:3px}
.bub .it span{position:relative;width:26px;height:26px;border-radius:8px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(120,70,30,.2)}
.bub .it span svg{width:21px;height:21px}
.bub .it span.done{opacity:.35;background:#dff3e0}
.bub .it span.done::after{content:"✓";position:absolute;color:var(--ok);font-weight:900;font-size:19px;line-height:1}
.bub.think{padding:6px 12px;font-weight:900;font-size:18px;letter-spacing:2px}
.bub.mini{padding:4px 6px}
.bub.mini svg{width:26px;height:26px}
.bub.dirty{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
.bub.urgent .ring{animation:shake .5s linear infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.sbadge{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;display:none}
.fl{position:absolute;left:0;top:0;font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 0 #7c2d12,0 0 8px rgba(124,45,18,.6);animation:rise 1.3s ease-out forwards;white-space:nowrap}
.fl small{font-size:14px;color:#ffe08a}
.fl.bad{color:#ffd0c0}
@keyframes rise{0%{opacity:0;margin-top:0;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-56px;scale:1}}
#toasts{position:fixed;left:50%;top:76px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none}
.toast{padding:8px 16px;border-radius:20px;background:rgba(58,35,20,.88);color:#fff6e5;font-weight:800;font-size:14px;animation:tin 2.4s ease forwards;white-space:nowrap}
.toast.bad{background:rgba(160,40,25,.92)}.toast.good{background:rgba(52,120,62,.93)}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.bar.clock.last i{background:linear-gradient(90deg,#e8863d,var(--bad))}
#t-time.last{color:var(--bad)}
/* coins flying to the HUD */
.cfly{position:fixed;left:0;top:0;width:22px;height:22px;z-index:7;pointer-events:none;transition:transform .7s cubic-bezier(.5,0,.75,.4),opacity .7s ease-in}
.cfly svg{width:22px;height:22px}
.chip.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
/* screens */
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:rgba(70,30,10,.34);backdrop-filter:blur(3px);padding:12px;overflow:auto}
body.low #screen{backdrop-filter:none}
.card{width:min(620px,100%);max-height:100%;overflow:auto;padding:22px 24px;text-align:center;animation:cin .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes cin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.card h1{margin:4px 0 2px;font-size:46px;line-height:1;color:var(--amber);font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.card h2{margin:0 0 6px;font-size:28px;font-weight:900}
.card p{margin:6px 0;font-weight:700;color:#5a3d2a;line-height:1.35}
.card .big{width:76px;height:76px;margin:0 auto}
.card .biglogo{display:block;width:128px;height:128px;margin:-4px auto 0;filter:drop-shadow(0 4px 8px rgba(90,40,10,.25))}
.how{list-style:none;padding:0;margin:12px 0;text-align:left;display:grid;gap:7px}
.how li{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px;line-height:1.3;background:rgba(255,255,255,.5);border-radius:12px;padding:8px 10px}
.how li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:14px;background:linear-gradient(#ee7a34,var(--amber));color:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 0 #8a2d08,0 8px 16px rgba(120,40,10,.3);margin:6px 4px;transition:transform .08s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a2d08}
.btn.alt{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:0 4px 0 rgba(120,70,30,.25)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.rowk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.5);margin:5px 0}
.rowk span:last-child{font-weight:900}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.stars svg{width:54px;height:54px}
.stars svg.pop{animation:starpop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.chipnew{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#fff;border-radius:30px;padding:6px 16px 6px 8px;font-weight:900;margin:8px 0}
.chipnew svg{width:30px;height:30px;background:#fff;border-radius:50%;padding:3px}
.menurow{display:flex;gap:8px;justify-content:center;margin:8px 0}
.menurow span{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center}
.menurow span svg{width:30px;height:30px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:10px 0;text-align:left}
.up{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.58);border:2px solid transparent}
.up.can{border-color:rgba(194,65,12,.55)}
.up .ic{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.up .ic svg{width:32px;height:32px}
.up .tx{flex:1;min-width:0}
.up .tx b{display:block;font-size:15px;font-weight:900}
.up .tx small{display:block;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.2}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:14px;height:6px;border-radius:3px;background:rgba(80,40,10,.2)}.pips i.on{background:var(--amber)}
.buy{min-width:70px;padding:7px 8px;border-radius:11px;background:var(--amber);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 #8a2d08}
.buy svg{width:16px;height:16px}
.buy[disabled]{background:#b9a99a;box-shadow:0 3px 0 #8d7b6c;pointer-events:none}
.buy.max{background:var(--ok);box-shadow:0 3px 0 #2c6a35}
.wallet{display:inline-flex;gap:8px;align-items:center;font-size:22px;font-weight:900;background:rgba(255,255,255,.6);padding:6px 16px;border-radius:30px}
.wallet svg{width:26px;height:26px}
.lang{position:absolute;right:14px;top:12px}
.card{position:relative}
.card .gear{position:absolute;left:14px;top:12px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0}
.col .btn{min-width:min(260px,100%);margin:4px}
.foot{margin:12px 0 0;font-size:12px;font-weight:700;color:var(--ink2)}
.foot a{color:var(--amber);text-decoration:none;font-weight:900}
.foot a:hover{text-decoration:underline}
.rec{display:inline-block;margin:4px 0;padding:4px 14px;border-radius:20px;background:#f2b632;color:#5a3410;font-weight:900;animation:starpop .6s cubic-bezier(.2,1.6,.4,1) both .4s}
/* settings */
.set{display:grid;gap:8px;margin:12px 0;text-align:left}
.set label,.set .row{display:flex;align-items:center;gap:12px;font-weight:800;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.5);min-height:48px}
.set label span:first-child,.set .row span:first-child{flex:none;width:118px}
.set input[type=range]{flex:1;accent-color:var(--amber);height:28px;min-width:0}
.set output{width:38px;text-align:right;font-weight:900}
.seg{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.seg button{flex:1;min-height:36px;border-radius:10px;background:rgba(255,255,255,.7);font-weight:900;padding:4px 10px}
.seg button.on{background:var(--amber);color:#fff}
.set small{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin:-2px 2px 0}
:focus-visible{outline:3px solid var(--amber2);outline-offset:2px}
#c:focus-visible{outline:none}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#dbg{position:fixed;left:8px;top:84px;z-index:20;font:12px/1.35 ui-monospace,Consolas,monospace;color:#102;background:rgba(255,255,255,.82);padding:5px 8px;border-radius:8px;display:none;max-width:60vw;white-space:pre-wrap;pointer-events:none}
#dbg .err{color:#c00;font-weight:700}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:800;background:#fbe3c3;z-index:50}
@media (max-width:700px){
 #top{gap:6px 10px;padding:6px 8px;top:6px;left:6px;right:6px}
 #top .logo{display:none}
 .btns{order:1;margin-left:auto}
 .sp{display:none}
 .chip.cc{order:2}
 .bar{width:56px}
 .chip{font-size:14px}
 #dock{left:4px;right:4px;bottom:calc(4px + env(safe-area-inset-bottom));gap:5px}
 #tray{padding:5px 8px;gap:6px;width:100%;justify-content:center}
 #tray .lbl{display:none}
 .slot{width:34px;height:34px}.slot svg{width:25px;height:25px}
 #stations{width:100%;justify-content:space-between;gap:3px;padding:4px}
 .st{width:auto;flex:1;padding:5px 2px 6px}
 .st svg{width:26px;height:26px}
 .st b{font-size:11px}
 .st .key{display:none}
 .bub{padding:3px 6px 3px 3px;gap:3px}
 .bub .ring,.bub .ring svg.r{width:30px;height:30px}
 .bub .ring .av{inset:5px}.bub .ring .av svg{width:20px;height:20px}
 .bub .it span{width:21px;height:21px;border-radius:6px}.bub .it span svg{width:17px;height:17px}
 .card{padding:16px 14px}.card h1{font-size:36px}.card .biglogo{width:96px;height:96px}.card h2{font-size:23px}
 .stars svg{width:44px;height:44px}
 #toasts{top:100px}
 #dbg{top:100px}
}
@media (max-width:700px){#top .hud-gear{display:none}} /* settings stay reachable from the pause menu */
@media (max-width:420px){#t-clkbar{display:none}}
/* landscape phones: a one-row top bar and compact cards, so the main buttons fit without scrolling */
@media (max-height:500px) and (orientation:landscape){
 #top .logo{display:none}
 .card{padding:10px 16px}.card .biglogo{display:none}.card h1{font-size:30px}.card h2{font-size:21px;margin:2px 0}.card p{margin:3px 0}
 .how{grid-template-columns:1fr 1fr;margin:6px 0;gap:5px}.how li{font-size:12px;padding:5px 8px}
 .btn{padding:6px 22px;min-height:44px;margin:3px}.col{margin:3px 0}.set{gap:6px}.foot{margin-top:4px}
}
@media (pointer:coarse){.ibtn{min-width:44px;height:44px}.slot{width:44px;height:44px}.st{min-height:64px}.btn.sm{min-height:44px}.seg button{min-height:44px}}
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="wl"></div>
<header id="top" class="glass"></header>
<div id="toasts"></div>
<div id="dock"></div>
<div id="screen"></div>
<div id="dbg"></div>
<div id="fatal">Three.js could not be loaded (internet connection needed for the CDN). Please reload when online.</div>
<script type="module">
/* ============================================================
   Çay Ocağı - single file 3D tea house time-management game
   ============================================================ */
let THREE;
try { THREE = await import('three'); }
catch (e) { document.getElementById('fatal').style.display = 'flex'; throw e; }

const Q = new URLSearchParams(location.search);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
/* settings (arena.cay.settings), migrated once from the old cay_prefs / cay_best keys */
const KEY = { settings: 'arena.cay.settings', save: 'arena.cay.save', best: 'arena.cay.best' };
const SET = (() => {
  let s = store.get(KEY.settings, null);
  if (!s) {
    const old = store.get('cay_prefs', {});
    s = { master: .8, music: .6, sfx: .8, lang: old.lang || null, quality: 'high', muted: !!old.muted };
    const ob = store.get('cay_best', null); if (ob && !store.get(KEY.best, null)) store.set(KEY.best, ob);
  }
  return Object.assign({ master: .8, music: .6, sfx: .8, lang: null, quality: 'high', muted: false }, s);
})();
function saveSettings() { store.set(KEY.settings, SET); }
const FLAG = {
  auto: Q.has('auto'), debug: Q.has('debug'), low: Q.has('low') || SET.quality === 'low',
  // test runs never touch the player's saved game
  nosave: Q.has('nosave') || Q.has('auto') || Q.has('bench') || Q.has('clicktest'),
  sim: parseFloat(Q.get('sim')) || 0,
  stop: Q.get('stop') || '', stopDay: parseInt(Q.get('stopday')) || 0,
  day: parseInt(Q.get('day')) || 0,

let LOGO_BIG = `<div class="big">${ICON.tea}</div>`;
function useIconPNGs() {
  for (const k of ICON_PNG) ICON[k] = pngIcon(`assets/ui/icons/${k}.png`);

  LOGO_BIG = '<img class="biglogo" src="assets/ui/logo.png" alt="">';
  const fav = document.querySelector('link[rel=icon]'); if (fav) fav.href = 'assets/ui/favicon.png';
}
// icon PNGs + logo, counted in the title's "Loading… n/N"
function loadIcons(tick) {
  const files = ICON_PNG.map(k => `assets/ui/icons/${k}.png`).concat('assets/ui/logo.png');
  return Promise.all(files.map(src => new Promise(res => {
    const im = new Image(); im.onload = () => { tick(); res(true); }; im.onerror = () => { tick(); res(false); }; im.src = src;
  }))).then(ok => {
    if (ok.every(Boolean)) { useIconPNGs(); return true; }
    console.warn('[cay] icon PNGs missing, keeping the drawn icons'); return false;
  });
}

/* ---------------- navigation grid + A* ---------------- */
const GX0 = -9, GZ0 = -9.5, CS = 0.5, GW = 48, GH = 40;

/* ---------------- people pool ---------------- */
const MAXP = 40;

const HAIR = [0x2a1a10, 0x4a2c18, 0x1c1c1c, 0x6b4426, 0x8a5a2a];
const SHIRT = [0x4c8a8e, 0xc2602a, 0x7a9a4a, 0x8a6bb0, 0xd9a43c, 0xb85a6a, 0x5a7fb0];
const pick = a => a[(rnd() * a.length) | 0];

/* ---------------- customers ---------------- */
function pickType(cfg) {
  const e = Object.entries(cfg.types); let sum = 0; e.forEach(x => sum += x[1]);
  let r = rnd() * sum; for (const [k, w] of e) { r -= w; if (r <= 0) return k; }
  return e[0][0];
}
function pickItem(menu) {
  let sum = 0; menu.forEach(i => sum += ITEM_W[i]); let r = rnd() * sum;
  for (const i of menu) { r -= ITEM_W[i]; if (r <= 0) return i; }
  return menu[0];
}
function spawnParty() {
  const cfg = dayCfg(G.day);
  const free = G.tables.filter(tb => tb.unlocked && !tb.party && !tb.dirty && !tb.claimed);
  if (!free.length) return false;
  const type = pickType(cfg), cc = CUST[type];
  if (personFree.length < cc.size) return false;
  const tb = free[(rnd() * free.length) | 0];
  const n = cc.items[0] + ((rnd() * (cc.items[1] - cc.items[0] + 1)) | 0);
  const order = []; for (let i = 0; i < n; i++) order.push({ item: pickItem(cfg.menu), done: false });
  const dm = Math.max(0.78, 1 - 0.03 * (G.day - 1));
  const maxP = cc.patience * stoolMul() * dm;
  const party = { id: ++G.spawnCount, type, tb: tb.i, persons: [], order, state: 'enter', timer: 0, patience: maxP, maxP, finalFrac: 1, cc, sig: '' };
  const ap = tableApproach(tb.i);
  const base = findPath(SPAWN.x, SPAWN.z, ap.x, ap.z);
  for (let k = 0; k < cc.size; k++) {
    const seat = seatPos(tb.i, k);
    const body = type === 'office' ? 0x3a4656 : type === 'regular' ? 0x9a6a44 : pick(SHIRT);
    const pe = {
      idx: allocPerson(), x: SPAWN.x + k * 0.5, z: SPAWN.z + k * 0.3, y: 0, face: -Math.PI / 2, path: base.map(p => ({ ...p })).concat([seat]),
      delay: k * 0.85, seat, sitting: false, arrived: false, moving: false, body, skin: pick(SKIN),
      hair: type === 'regular' ? 0xe8e8e8 : pick(HAIR), cap: type === 'regular', big: type === 'regular' ? 1.12 : 1, type, mood: 0, speed: type === 'office' ? 3.2 : 2.6, flash: 0, leaving: false, done: false
    };

}
function slotFor(tb, item) {

  tb.slots.push({ kind, item, dirty: false });
}
function finishLeave(p, angry) {
  const tb = G.tables[p.tb];
  p.state = 'leave'; tb.party = null;
  tb.dirty = tb.slots.length > 0;
  if (!tb.dirty) tb.slots = [];
  tb.slots.forEach(s => s.dirty = true);
  for (const pe of p.persons) {
    pe.leaving = true; pe.sitting = false; pe.arrived = false;
    pe.path = findPath(pe.x, pe.z, EXIT.x, EXIT.z);

}

const C_cache = new Map();
function setTxt(id, v) { if (C_cache.get(id) !== v) { C_cache.set(id, v); const el = document.getElementById(id); if (el) el.textContent = v; } }
function setHTML(el, key, v) { if (C_cache.get(key) !== v) { C_cache.set(key, v); el.innerHTML = v; } }
function setW(id, pct) { const k = id + '#w'; const v = Math.round(pct * 10) / 10; if (C_cache.get(k) !== v) { C_cache.set(k, v); const el = document.getElementById(id); if (el) el.style.width = v + '%'; } }
function setVis(el, key, v) { if (C_cache.get(key) !== v) { C_cache.set(key, v); el.style.display = v; } }

const _sp = { x: 0, y: 0 };
let _hoverStation = null;
function uiFrame(dt, force) {
  const play = G.state === 'play';
  /* top bar */
  setTxt('t-day', G.endless ? t('dayEndless', G.day) : t('dayOf', G.day));
  setTxt('t-time', fmtTime(G.dayLen - G.clock));
  setW('t-clk', clamp(G.clock / G.dayLen, 0, 1) * 100);
  const last = play && G.clock > G.dayLen - 20;
  if (C_cache.get('last') !== last) { C_cache.set('last', last); UI.clk.classList.toggle('last', last); UI.time.classList.toggle('last', last); }
  setTxt('t-coins', String(G.dayCoins)); setTxt('t-target', String(G.target));
  setW('t-cbar', clamp(G.dayCoins / Math.max(1, G.target), 0, 1) * 100);
  setTxt('t-happy', String(G.happy)); setTxt('t-angry', String(G.angry));
  { const v = G.speed + '×'; if (C_cache.get('sp') !== v) { C_cache.set('sp', v); UI.sp.textContent = v; UI.sp.classList.toggle('on', G.speed > 1); } }
  { const v = G.paused ? 1 : 0; if (C_cache.get('pb') !== v) { C_cache.set('pb', v); UI.pb.innerHTML = G.paused ? ICON.play : ICON.pause; UI.pb.classList.toggle('on', !!G.paused); } }
  setVis(dockEl, 'v-dock', play ? 'flex' : 'none');
  setVis(topEl, 'v-top', play || G.state === 'intro' ? 'flex' : 'none');
  setVis(wlEl, 'v-wl', play || G.state === 'intro' || G.state === 'title' ? 'block' : 'none');
  const cfg = dayCfg(G.day), w = G.waiter, S = G.stations;
  /* tray */
  if (w) {
    const cap = trayCap();
    const sig = w.tray.join(',') + '|' + cap;
    if (C_cache.get('tray') !== sig) {
      C_cache.set('tray', sig);
      UI.slots.forEach((el, i) => {
        const it = w.tray[i]; el.className = 'slot' + (it ? ' full' : '') + (i >= cap ? ' lock' : '');
        el.innerHTML = it ? ICON[it] : ''; el.title = it ? (it === 'dirty' ? t('dirty') : t(it)) : '';
      });
    }
    const qs = w.q.map(a => a.type === 'station' ? a.id : 'T' + (a.id + 1)).join(',') + (w.cur ? '*' : '');
    if (C_cache.get('q') !== qs) {
      C_cache.set('q', qs);
      UI.queue.innerHTML = w.q.map(a => a.type === 'station' ? `<span class="q" style="background:#fff">${ICON[a.id].replace('<svg', '<svg width="16" height="16"')}</span>` : `<span class="q">${a.id + 1}</span>`).join('') + (w.q.length ? `<span class="qx" data-a="clearq">${t('clearQ')}</span>` : '');
    }
  }
  /* stations dock */
  if (S && play) {
    for (const { el, k, us, ce } of UI.sts) {
      let ready = false, cnt = 0;
      const locked = k !== 'tea' && k !== 'sink' && !cfg.menu.includes(k);
      if (C_cache.get('lk' + k) !== locked) { C_cache.set('lk' + k, locked); el.classList.toggle('lock', locked); }
      us.forEach((u, j) => {
        let cls = 'u', wd = 0;
        if (k === 'tea') { const hide = j > G.up.kettle; setVis(u, 'uh' + j, hide ? 'none' : ''); if (hide) return; const kk = S.kettles[j]; if (kk.st === 'brewing') wd = kk.t / BREW_T * 100; else if (kk.st === 'ready') { cls += ' ready'; ready = true; cnt += kk.n; } }
        else if (k === 'simit') { const o = S.oven; if (o.st === 'baking') wd = o.t / ovenTime() * 100; else if (o.st === 'ready') { cls += ' ready'; ready = true; cnt += o.n; } }
        else if (k === 'coffee') { const p = S.pots[j]; if (p.st === 'cook') wd = p.t / COOK_T * 100; else if (p.st === 'ready') { cls += ' warn'; wd = (1 - p.t / COOK_WIN) * 100; ready = true; cnt++; if (COOK_WIN - p.t < 1.3) cls += ' blink'; } else if (p.st === 'spilled') cls += ' bad'; }
        const key = k + j; const v = cls + '|' + Math.round(wd);
        if (C_cache.get(key) !== v) { C_cache.set(key, v); u.className = cls; u.firstElementChild.style.width = Math.round(wd) + '%'; }
      });
      if (k === 'sink') { cnt = w ? w.tray.filter(x => x === 'dirty').length : 0; }
      const cv = cnt ? String(cnt) : ''; if (C_cache.get('c' + k) !== cv) { C_cache.set('c' + k, cv); ce.textContent = cv; ce.style.display = cv ? 'grid' : 'none'; }
      if (k === 'tea' && G.day === 1 && !G.won && G.clock < 40 && S.kettles[0].st === 'empty' && w && !w.q.length && !w.cur) ready = true;
      const rv = (ready && k !== 'sink') + '|' + (_hoverStation === k);
      if (C_cache.get('r' + k) !== rv) { C_cache.set('r' + k, rv); el.classList.toggle('ready', ready && k !== 'sink'); el.classList.toggle('hov', _hoverStation === k); }
    }
  }
  /* world overlays: table bubbles */
  if (play || G.state === 'intro') {
    for (let i = 0; i < 6; i++) {
      const el = wlEl.children[i]; if (!el) continue;
      const tb = G.tables[i]; let mode = 'none', sig = '';
      if (tb && tb.unlocked && play) {
        const p = tb.party;
        if (p && p.state === 'think') { mode = 'think'; sig = 'think'; }
        else if (p && p.state === 'wait') { mode = 'wait'; sig = 'wait' + p.type + deliverMask(p) + p.order.map(o => o.item[0]).join(''); }
        else if (p && p.state === 'eat') { mode = 'eat'; sig = 'eat'; }
        else if (!p && tb.dirty) { mode = 'dirty'; sig = 'dirty'; }
      }
      if (mode === 'none') { if (el.style.display !== 'none') el.style.display = 'none'; continue; }
      if (el._sig !== sig) {
        el._sig = sig; el.className = 'bub' + (mode === 'think' ? ' think' : mode === 'dirty' || mode === 'eat' ? ' mini' : '') + (mode === 'dirty' ? ' dirty' : '');
        if (mode === 'think') el.textContent = '…';
        else if (mode === 'dirty') el.innerHTML = ICON.dirty;
        else if (mode === 'eat') el.innerHTML = ICON.happy;
        else {
          const p = tb.party;
          el.innerHTML = `<div class="ring"><svg class="r" viewBox="0 0 38 38"><circle cx="19" cy="19" r="16" fill="none" stroke="rgba(80,40,10,.18)" stroke-width="4"/><circle class="pr" cx="19" cy="19" r="16" fill="none" stroke="#4fa65a" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg><div class="av">${ICON[p.type === 'normal' ? 'person' : p.type]}</div></div><div class="it">${p.order.map(o => `<span class="${o.done ? 'done' : ''}">${ICON[o.item]}</span>`).join('')}</div>`;
        }
      }
      if (mode === 'wait') {
        const p = tb.party, f = clamp(p.patience / p.maxP, 0, 1), pr = el.querySelector('.pr');
        if (pr) { pr.style.strokeDashoffset = (100.5 * (1 - f)).toFixed(1); pr.style.stroke = `hsl(${Math.round(f * 120)},62%,44%)`; }
        el.classList.toggle('urgent', f < .25);

      el.style.display = 'flex';
      el.style.transform = `translate(${Math.round(_sp.x)}px,${Math.round(_sp.y)}px) translate(-50%,-100%) translateY(-8px)`;
    }
    ['tea', 'simit', 'coffee'].forEach((k, j) => {
      const el = wlEl.children[6 + j]; if (!el || !S || !play) { if (el) el.style.display = 'none'; return; }
      let cnt = 0, urgent = false;
      if (k === 'tea') S.kettles.slice(0, 1 + G.up.kettle).forEach(x => { if (x.st === 'ready') cnt += x.n; });
      if (k === 'simit' && S.oven.st === 'ready') cnt = S.oven.n;
      if (k === 'coffee') S.pots.forEach(x => { if (x.st === 'ready') { cnt++; if (COOK_WIN - x.t < 1.3) urgent = true; } });
      if (!cnt) { el.style.display = 'none'; return; }
      setHTML(el, 'sb' + k, `${ICON[k]}<b style="font-size:13px">×${cnt}</b>`);
      toScreen(CNT_X, k === 'tea' ? 3.9 : 3.35, k === 'tea' ? -4.45 : STATION_Z[k], _sp);

function toast(msg, kind = '') {
  if (G.simming) return false;
  while (toastsEl.children.length >= 3) toastsEl.removeChild(toastsEl.firstChild);
  const d = document.createElement('div'); d.className = 'toast ' + kind; d.textContent = msg; toastsEl.appendChild(d);
  setTimeout(() => d.remove(), 2400); return false;
}

  if (G.simming) return;

// a few coins fly from the paying table to the coin counter, which then bumps
function coinFly(wx, wz, n) {
  if (G.simming || G.state !== 'play' || !UI.coinChip || UI.coinChip.offsetParent === null) return;
  const tr = $('#t-coins').getBoundingClientRect(); toScreen(wx, 1.6, wz, _sp);
  const k = Math.min(4, 1 + (n / 8 | 0));
  for (let i = 0; i < k; i++) {
    const e = document.createElement('div'); e.className = 'cfly'; e.innerHTML = ICON.coin;
    const sx = _sp.x - 11 + (Math.random() - .5) * 26, sy = _sp.y - 11 + (Math.random() - .5) * 16;
    e.style.transform = `translate(${sx}px,${sy}px)`; document.body.appendChild(e);
    setTimeout(() => { e.style.transform = `translate(${tr.left - 4}px,${tr.top}px) scale(.8)`; e.style.opacity = '.4'; }, 40 + i * 70);
    setTimeout(() => e.remove(), 800 + i * 70);
  }
  setTimeout(() => { UI.coinChip.classList.remove('bump'); void UI.coinChip.offsetWidth; UI.coinChip.classList.add('bump'); }, 760);
}

  const hits = ray.intersectObjects(pickables.map(p => p.mesh), false);
  for (const h of hits) { const p = pickables.find(q => q.mesh === h.object); if (p.kind === 'table' && !(G.tables[p.id] && G.tables[p.id].unlocked)) continue; return p; }

/* ============================================================
   generated models + cobblestone texture, with the procedural world as fallback
   ============================================================ */
// Loaded at start-up while the title screen shows "Loading… n/m" (Play disabled). Each model that loads replaces its
// procedural part; anything that fails keeps the original. Skipped from file:// and with ?noassets (see USE_MODELS).
const MODEL_FILES = ['semaver', 'oven', 'coffee', 'ayran', 'sink', 'table', 'window', 'ferry', 'cat'];
const MODEL_YAW = { oven: Math.PI / 2, coffee: Math.PI / 4, sink: Math.PI / 2, ferry: Math.PI / 2 }; // turns each model to face +X (the sand box was generated at 45°)
const loadedModels = {}; let groundTex = null;
async function loadAssets() {
  const tick = () => { assetState.loaded++; uiLoading(); };
  assetState.total = ICON_PNG.length + 1 + (USE_MODELS ? MODEL_FILES.length + 1 : 0);
  const icons = loadIcons(tick); // also from file://
  if (!USE_MODELS) return icons;
  let GLTFLoader;
  try { ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js')); }
  catch (e) { console.warn('[cay] GLTFLoader not available, keeping the procedural look'); return icons; }
  const loader = new GLTFLoader();
  const plain = a => { const o = new Float32Array(a.count * a.itemSize); for (let i = 0; i < a.count; i++) for (let k = 0; k < a.itemSize; k++) o[i * a.itemSize + k] = a.getComponent(i, k); return o; };
  const one = name => loader.loadAsync(`assets/models/${name}.glb`).then(gltf => {
    // one non-indexed geometry (position + uv) with the node transforms applied, pivot at the base centre, facing +X
    const P = [], U = []; let map = null;
    gltf.scene.updateMatrixWorld(true);
    gltf.scene.traverse(o => {
      if (!o.isMesh) return;
      const g = new THREE.BufferGeometry(), src = o.geometry;
      g.setAttribute('position', new THREE.BufferAttribute(plain(src.attributes.position), 3));
      g.setAttribute('uv', new THREE.BufferAttribute(src.attributes.uv ? plain(src.attributes.uv) : new Float32Array(src.attributes.position.count * 2), 2));
      if (src.index) g.setIndex(src.index.clone());
      g.applyMatrix4(o.matrixWorld);
      const n = g.index ? g.toNonIndexed() : g;
      P.push(...n.attributes.position.array); U.push(...n.attributes.uv.array);
      map = map || o.material.map;
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
    geo.rotateY(MODEL_YAW[name] || 0);
    geo.computeBoundingBox();
    const b = geo.boundingBox;
    geo.translate(-(b.min.x + b.max.x) / 2, -b.min.y, -(b.min.z + b.max.z) / 2);
    geo.computeVertexNormals(); geo.computeBoundingBox();
    loadedModels[name] = { geo, size: geo.boundingBox.getSize(new THREE.Vector3()), mat: new THREE.MeshLambertMaterial({ map, flatShading: true }) };
  }).catch(err => console.warn('[cay] model not loaded, keeping the procedural one:', name, err && err.message || err)).finally(tick);
  const tex = new THREE.TextureLoader().loadAsync('assets/textures/cobblestone.webp').then(tx => {
    tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.anisotropy = 4; groundTex = tx;
  }).catch(() => console.warn('[cay] cobblestone texture not loaded, keeping the tiled ground')).finally(tick);

}
// mean x/z of the vertices in the top `frac` of a (scaled) geometry: finds a chimney on a model
function topSpot(geo, frac) {
  const p = geo.attributes.position, y0 = geo.boundingBox.max.y * (1 - frac); let x = 0, z = 0, n = 0;

}
function applyAssets() {
  const M = loadedModels, skip = new Set(Object.keys(M));
  if (groundTex) skip.add('ground');

  if (!skip.size) return;
  // rebuild the merged world without the parts that now come from models
  world.remove(worldMeshes.wm, worldMeshes.gm); worldMeshes.wm.geometry.dispose(); worldMeshes.gm.geometry.dispose();
  Object.assign(worldMeshes, buildWorld(skip));
  const sh = !FLAG.low;
  // geometry of model `name` scaled by (sx, sy, sz), pivot still at the base centre
  const geoOf = (name, sx, sy = sx, sz = sx) => { const g = M[name].geo.clone().scale(sx, sy, sz); g.computeBoundingBox(); return g; };

    M.semaver.mat.color.setScalar(1.2); // the brass texture is a little dull under the warm light

    place('oven', g, CNT_X, TOP, zc);

    FIT.smoke = [CNT_X + cx, TOP + h + .1, zc + cz];
    FIT.ringY = TOP + h * .87; FIT.ringX = CNT_X + .15;
    // the glow sits at the back of the arched mouth (measured on the model with tools/assets/front.mjs:
    // mouth centre .045 off-centre, 21-46 % of the height, 33 % of the width, back wall .03 behind the centre)
    DYN.ovenGlow.position.set(CNT_X - .03 * sc, TOP + .32 * sc, zc - .045 * sc); DYN.ovenGlow.scale.set(1, .24 * sc / .62, .33 * sc / .82);

  }

  if (M.sink) place('sink', geoOf('sink', 1.55 / M.sink.size.z), CNT_X + .3, TOP, STATION_Z.sink);

    const g = geoOf('window', 1.05 / M.window.size.y), im = new THREE.InstancedMesh(g, M.window.mat, 5), wx = -8.1 + g.boundingBox.max.x - .04;

  }

    // white cloth tinted per table by the existing instance colours; top at the old height (.975), pivot moved to y .93
    const g = geoOf('table', 1.8 / M.table.size.x, .98 / M.table.size.y, 1.8 / M.table.size.z).translate(0, -.93, 0);
    TB.tops.geometry.dispose(); TB.tops.material.dispose(); TB.tops.geometry = g; TB.tops.material = M.table.mat; TB.legs.visible = false;
  }
  if (M.ferry) { const f = ferryObj.children[0]; f.geometry.dispose(); f.material.dispose(); f.geometry = geoOf('ferry', 8 / M.ferry.size.x).translate(0, -.55, 0); f.material = M.ferry.mat; }
  if (M.cat) { const c = catGrp.children[0]; c.geometry.dispose(); c.material.dispose(); c.geometry = geoOf('cat', .85 / M.cat.size.x); c.material = M.cat.mat; }

}

window.addEventListener('error', e => { G.errors.push((e.message || 'error') + (e.lineno ? ' @' + e.lineno : '')); if (G.errors.length > 5) G.errors.shift(); });

let lastT = performance.now(), acc = 0, fpsT = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  fpsT += dtReal; fpsN++; if (fpsT >= .5) { G.fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0; }
  if (!G.paused && !document.hidden) {
    acc += dtReal * G.speed; let n = 0;
    while (acc >= STEP && n < 14) { simStep(STEP); acc -= STEP; n++; }
    if (n >= 14) acc = 0;
  }
  if (G.waiter) syncVisuals(dtReal);
  if (!G.paused) particlesUpdate(dtReal * Math.min(G.speed, 2));
  uiFrame(dtReal);
  hoverRing.material.opacity = .6 + Math.sin(now / 160) * .25;
  renderer.render(scene, cam);
  G.drawCalls = renderer.info.render.calls; if (G.drawCalls > G.maxDrawCalls) G.maxDrawCalls = G.drawCalls;
}

window.cayBench = function (n, base) {
  const res = []; G.botHold = false; const keep = FLAG.stop; FLAG.stop = '';
  for (let i = 0; i < n; i++) {
    _seed = (base || 1) * 1000 + i; G.log = []; G.state = 'title'; A.start(); G.simming = true; let steps = 0;
    while (G.state !== 'victory' && G.state !== 'gameover' && steps < 60 * 60 * 80) { simStep(STEP); steps++; }
    res.push({ reached: G.day, state: G.state, log: G.log.slice() });
  }
  G.simming = false; FLAG.stop = keep;
  const days = {}; res.forEach(r => r.log.forEach(l => { const o = days[l.day] || (days[l.day] = { n: 0, ratio: 0, angry: 0, happy: 0, stars: 0, fail: 0, sp: 0, bl: 0 }); o.n++; o.sp += l.spawned; o.bl += l.blocked; o.ratio += l.coins / l.target; o.angry += l.angry; o.happy += l.happy; o.stars += l.stars; if (!l.passed) o.fail++; }));
  let s = `bench n=${n} wins=${res.filter(r => r.state === 'victory').length}
`;
  Object.keys(days).forEach(k => { const o = days[k]; s += `d${k}: ratio ${(o.ratio / o.n).toFixed(2)} happy ${(o.happy / o.n).toFixed(1)} angry ${(o.angry / o.n).toFixed(1)} stars ${(o.stars / o.n).toFixed(1)} fail ${o.fail}/${o.n} spawned ${(o.sp / o.n).toFixed(1)} walkby ${(o.bl / o.n).toFixed(1)}
`; });
  G.benchOut = s; return s;
};
function clickTest() {
  const out = []; A.start(); A.begin(); G.botHold = true; G.paused = false;
  const fire = (type, x, y) => canvas.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, pointerId: 7, pointerType: 'mouse', button: 0, bubbles: true }));
  const clickWorld = (x, y, z) => { toScreen(x, y, z, _sp); fire('pointerdown', _sp.x, _sp.y); fire('pointerup', _sp.x, _sp.y); };
  toScreen(CNT_X, 1.8, STATION_Z.tea, _sp); const pk = pickAt(_sp.x, _sp.y); out.push('pick@tea=' + (pk ? pk.kind + ':' + pk.id : 'none') + ' at ' + Math.round(_sp.x) + ',' + Math.round(_sp.y) + ' state=' + G.state);
  clickWorld(CNT_X, 1.8, STATION_Z.tea); out.push('queue after tea click=' + G.waiter.q.length);
  window.caySim(9); out.push('kettle=' + G.stations.kettles[0].st + ' t=' + G.stations.kettles[0].t.toFixed(1));
  window.caySim(2); out.push('kettle=' + G.stations.kettles[0].st);
  clickWorld(CNT_X, 1.8, STATION_Z.tea); window.caySim(5); out.push('tray=' + G.waiter.tray.join('+'));
  clickWorld(-1.0, 1.0, -0.5); out.push('queue after table click=' + G.waiter.q.length);
  clickWorld(CNT_X, 1.8, STATION_Z.ayran); out.push('ayran(locked) queue=' + G.waiter.q.length);
  window.caySim(4); out.push('waiter state=' + G.waiter.state + ' tray=' + G.waiter.tray.join('+'));
  G.testOut = out.join(' | ');
}
if (Q.has('audiotest')) {
  sfxInit(); const fns = { sfxBell, sfxClink, sfxCash, sfxPip, sfxPing, sfxTick, sfxPour, sfxWash, sfxHiss, sfxWhistle, sfxGrumble, sfxFanfare, sfxLose, sfxGull, sfxHorn, sfxMeow }; let okc = 0;
  if (!Aud.ctx) G.testOut = 'audio: no Web Audio';
  else Aud.ctx.resume().then(() => { for (const k in fns) { try { fns[k](); okc++; } catch (e) { G.errors.push(k + ': ' + e.message); } } G.testOut = 'audio state=' + Aud.ctx.state + ' called=' + okc + '/' + Object.keys(fns).length; }).catch(e => G.errors.push('audio ' + e.message));
}
if (Q.has('clicktest')) { try { clickTest(); } catch (e) { G.errors.push('clicktest: ' + e.message); } }
if (FLAG.bench) { try { window.cayBench(FLAG.bench, 1); } catch (e) { G.errors.push('bench: ' + e.message); } }
if (FLAG.sim > 0) { try { window.caySim(FLAG.sim); } catch (e) { G.errors.push('sim: ' + e.message + ' ' + (e.stack || '').split('\n')[1]); } }
requestAnimationFrame(frame);
// the title screen waits for the models (Play disabled); after 15 s the game goes on with whatever has loaded.
// ?auto starts at once as before and the models swap in when they arrive, so bot runs stay comparable.
// G.assetsReady / G.assets: test hooks (which generated assets replaced their procedural part)
G.assets = [];
if (!NOASSETS) Promise.race([loadAssets(), new Promise(r => setTimeout(r, 15000))]).then(() => {
  try { applyAssets(); } catch (e) { G.errors.push('assets: ' + e.message); }
  assetState.done = true; G.assetsReady = true;
  uiStatic(); uiScreen(true); // the icon PNGs are in now
});

</script>
